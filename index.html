<!DOCTYPE html>
<html>
<body style="background:black;color:yellow;text-align:center;">

<h1>Rob Friend</h1>

<input id="username" placeholder="Roblox name">
<button onclick="login()">Login</button>

<div id="profile"></div>

<script>
async function login(){
  let name = document.getElementById("username").value;

  const res = await fetch("https://users.roblox.com/v1/usernames/users", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({usernames:[name]})
  });

  const data = await res.json();

  if(!data.data.length){
    alert("ไม่เจอ user");
    return;
  }

  const id = data.data[0].id;
  const avatar = "https://www.roblox.com/headshot-thumbnail/image?userId="+id;

  document.getElementById("profile").innerHTML =
    "<h3>"+name+"</h3><img src='"+avatar+"'>";
}
</script>

</body>
</html>
