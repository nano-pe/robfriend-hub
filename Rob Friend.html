<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rob Friend</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  background: #000;
  color: #FFD700;
  font-family: monospace;
  text-align: center;
}

.box {
  border: 2px solid #FFD700;
  padding: 20px;
  margin: 20px;
  border-radius: 10px;
}

input, button {
  padding: 10px;
  margin: 5px;
  border: none;
  border-radius: 5px;
}

button {
  background: #FFD700;
  color: black;
  font-weight: bold;
}

img {
  width: 120px;
  border-radius: 10px;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>🎮 Rob Friend</h1>

<div class="box">
  <h3>Login Roblox</h3>
  <input id="username" placeholder="Enter Roblox Username">
  <br>
  <button onclick="login()">Login</button>

  <div id="profile"></div>
</div>

<div class="box">
  <h3>Invite Friend</h3>
  <input id="friend" placeholder="Friend Username">
  <br>
  <button onclick="invite()">Invite</button>
</div>

<div class="box">
  <h3>⭐ Stars: <span id="stars">0</span></h3>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBKW9j4Hfh88Ajd1oIrIRGzv0E3txL3-xA",
  authDomain: "rob-friends.firebaseapp.com",
  databaseURL: "https://rob-friends-default-rtdb.firebaseio.com/",
  projectId: "rob-friends",
  storageBucket: "rob-friends.firebasestorage.app",
  messagingSenderId: "620151248418",
  appId: "1:620151248418:web:dde10ad850cfd1d7f4dc7b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentUser = "";

async function login() {
  const name = document.getElementById("username").value;
  currentUser = name;

  const res = await fetch(`https://users.roblox.com/v1/usernames/users`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({usernames:[name]})
  });

  const data = await res.json();
  const id = data.data[0].id;

  const avatar = `https://www.roblox.com/headshot-thumbnail/image?userId=${id}&width=150&height=150&format=png`;

  document.getElementById("profile").innerHTML = `
    <h4>${name}</h4>
    <img src="${avatar}">
  `;

  db.ref("users/"+name).once("value", snap=>{
    if(!snap.exists()){
      db.ref("users/"+name).set({stars:0});
    }
  });

  db.ref("users/"+name+"/stars").on("value", snap=>{
    document.getElementById("stars").innerText = snap.val();
  });
}

function invite(){
  const friend = document.getElementById("friend").value;

  db.ref("users/"+friend).once("value", snap=>{
    if(snap.exists()){
      alert("Invite sent!");
      db.ref("users/"+currentUser+"/stars").transaction(s=>{
        return (s||0)+1;
      });
    }else{
      alert("User not found!");
    }
  });
}
</script>

</body>
</html>
